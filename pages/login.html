<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          <link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/global.css">

    <title>SACHAR - Login</title>
</head>

<body>

    <main class="auth-page">

        
    
    <section  class="login-container">
         <div class="auth-header">
            <div class="shield-logo"> 
                <img src="../assets/images/nirbhaya logo.png" alt="nirbahya -logo" class="shield">
            </div> <h1> NIRBHAYA </h1>
            <p> Security on your wrist,peace in your mind</p></div>
            <div class="login-card"><h2>Welcome Back!</h2> <p class="subtitle"> Login to continue your safest journey</p> </div>
            <div class="input-group">

        <label for="email">
            Email Address
        </label>

        <div class="input-wrapper">

            <span class="input-icon">✉</span>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
            >

        </div>

    </div>




    <div class="input-group">

        <label for="password">
            Password
        </label>

        <div class="input-wrapper">

            <span class="input-icon">🔒</span>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >
            <button
            type="button"
            class="eye-btn"
            id="togglePassword"
        >
            👁
        </button>

        </div>
</div>
<div class="login-options">

    <a href="forgot-password.html">
        Forgot Password?
    </a>

</div>
    </div>
    </section>
</main>
<script src="login.js"></script>
</body>

</html>
