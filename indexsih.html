<!DOCTYPE html>
<html lang="en">
    <head>
        <a href="login.html" class="home-btn">Home</a>
    </head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url("3307399721830180.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .box {
        width: 450px;
        padding: 50px;

        text-align: center;

        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);

        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.4);

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .box h1 {
        color: white;
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .option-btn {
        padding: 12px 30px;

        border: 2px solid white;
        border-radius: 10px;

        background: transparent;
        color: white;

        font-size: 16px;
        cursor: pointer;

        transition: 0.3s;
    }

    .option-btn:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    .option-btn.active {
        background: white;
        color: #222;
        transform: scale(1.05);
    }
</style>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Page</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">

            <div class="box">

                <h1>Welcome</h1>

                <div class="buttons">

                    <button class="option-btn active" onclick="selectButton(this)">
                        Button 1
                    </button>

                    <button class="option-btn" onclick="selectButton(this)">
                        Button 2
                    </button>

                </div>

            </div>

        </div>

        <script src="script.js"></script>

    </body>

    </html>
</body>

</html>
